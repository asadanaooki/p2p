<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app/purchase-order-supplier-selection.css}">

  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script th:src="@{/js/common.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <main class="page"
    th:with="currentSortBy=${form.sortBy.toString()}, currentSortDirection=${form.sortDirection.toString()}">
    <div class="mb-4">
      <h1 class="h4 mb-1" th:text="${orderType.label} + '発注書作成用仕入先選択'"></h1>
      <p class="text-muted mb-0">発注書を作成する仕入先を選択してください。</p>
    </div>

    <div class="card mb-3">
      <div class="card-header bg-body d-flex justify-content-end">
        <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="collapse"
          data-bs-target="#supplierSelectionFilter">
          詳細条件
        </button>
      </div>

      <div id="supplierSelectionFilter" class="collapse" th:classappend="${form.supplierId != null} ? 'show' : ''">
        <div class="card-body">
          <form id="purchaseOrderSearchForm" class="keyword-search-form" method="get"
            th:action="@{/purchase-order/create/supplier-selection}" th:object="${form}">
            <input type="hidden" name="orderType" th:value="${orderType}">
            <input type="hidden" th:field="*{sortBy}">
            <input type="hidden" th:field="*{sortDirection}">

            <div class="row">
              <div class="col-5">
                <label for="supplierId" class="form-label">仕入先</label>
                <select id="supplierId" class="form-select" th:field="*{supplierId}">
                  <option value=""></option>
                  <option th:each="supplier : ${view.supplierOptions}" th:value="${supplier.supplierId}"
                    th:text="${supplier.name}">
                  </option>
                </select>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-2">
              <button type="submit" class="btn btn-primary">絞り込み</button>
              <a class="btn btn-outline-secondary"
                th:href="@{/purchase-order/create/supplier-selection(orderType=${orderType})}">リセット</a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="border">
      <table class="table table-hover table-bordered supplier-selection-table mb-0">
        <thead class="table-light">
          <tr>
            <th class="col-supplier">
              <button type="button" class="sort-button js-sort" data-sort-by="SUPPLIER">
                <span>仕入先</span>
                <span th:if="${currentSortBy.equals('SUPPLIER')}"
                  th:text="${currentSortDirection.equals('ASC') ? '▲' : '▼'}"></span>
              </button>
            </th>

            <th class="col-detail-count">
              <button type="button" class="sort-button js-sort  justify-content-end" data-sort-by="DETAIL_COUNT">
                <span>明細数</span>
                <span th:if="${currentSortBy.equals('DETAIL_COUNT')}"
                  th:text="${currentSortDirection.equals('ASC') ? '▲' : '▼'}"></span>
              </button>
            </th>

            <th class="col-pr-number">
              PR番号
            </th>

            <th class="col-total">
              <button type="button" class="sort-button js-sort justify-content-end" data-sort-by="TOTAL_AMOUNT">
                <span>税抜合計</span>
                <span th:if="${currentSortBy.equals('TOTAL_AMOUNT')}"
                  th:text="${currentSortDirection.equals('ASC') ? '▲' : '▼'}"></span>
              </button>
            </th>

            <th class="col-actions text-center">
              操作
            </th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="row : ${view.supplierSelections}">
            <td class="col-supplier" th:text="${row.supplierName}"></td>
            <td class="col-detail-count text-end" th:text="${row.detailCount}"></td>

            <td class="col-pr-number align-middle">
              <div class="d-flex flex-wrap gap-1">
                <a class="badge text-bg-light border text-decoration-none text-reset"
                  th:each="pr : ${row.purchaseRequests}" th:text="${pr.displayNumber}"
                  th:href="@{/purchase-request/{prId}(prId=${pr.prId})}">
                </a>
              </div>
            </td>

            <td class="col-total text-end" th:text="${#numbers.formatInteger(row.totalAmountExcludingTax, 0, 'COMMA')}">
            </td>

            <td class="col-actions text-center">
              <a class="btn btn-primary btn-sm" th:if="${row.supplierId != null}" th:href="@{/purchase-order/create/detail-selection(orderType=${orderType},
                  supplierId=${row.supplierId})}">
                選択
              </a>

              <a class="btn btn-primary btn-sm" th:if="${row.supplierId == null}" th:href="@{/purchase-order/create/detail-selection(orderType=${orderType},
                  supplierName=${row.supplierName})}">
                選択
              </a>
            </td>
          </tr>

        </tbody>
      </table>

    </div>


  </main>
</body>

</html>
