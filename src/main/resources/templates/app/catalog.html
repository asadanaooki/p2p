<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/app/catalog.css}" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script defer th:src="@{/js/common.js}"></script>
  <script defer th:src="@{/js/app/catalog.js}"></script>
</head>

<body>
  <main class="page">
    <div class="page-header">
      <h1 class="page-title">カタログから追加</h1>
      <button type="button" id="closeCatalogButton" class="close-button">×</button>
    </div>

    <div id="catalogSearchErrorArea" class="search-error-area"></div>

    <div class="toolbar">
      <form id="catalogKeywordForm" th:object="${form}" class="keyword-search-form">
        <input type="hidden" th:field="*{kind}">
        <input type="hidden" th:field="*{supplierId}">
        <input type="hidden" th:field="*{page}">

        <div class="search-box">
          <input id="keyword" type="text" th:field="*{keyword}" class="search-input" placeholder="名称で検索">
          <button type="button" id="keywordSearchButton" class="search-icon-button">
            <svg class="search-icon" viewBox="0 0 632.399 632.399">
              <path
                d="M255.108,0C119.863,0,10.204,109.66,10.204,244.904c0,135.245,109.659,244.905,244.904,244.905
                    c52.006,0,100.238-16.223,139.883-43.854l185.205,185.176c1.671,1.672,4.379,1.672,5.964,0.115l34.892-34.891
                    c1.613-1.613,1.47-4.379-0.115-5.965L438.151,407.605c38.493-43.246,61.86-100.237,61.86-162.702
                    C500.012,109.66,390.353,0,255.108,0z M255.108,460.996c-119.34,0-216.092-96.752-216.092-216.092
                    c0-119.34,96.751-216.091,216.092-216.091s216.091,96.751,216.091,216.091C471.199,364.244,374.448,460.996,255.108,460.996z" />
            </svg>
          </button>
        </div>
      </form>
      <button type="button" id="filterToggleButton" class="filter-toggle-button">
        <svg class="filter-toggle-icon" viewBox="0 0 48 48">
          <polyline points="6.33 7 20.01 24 20.01 42 28.01 37 28.01 24 27.99 24 41.99 7 15.01 7" fill="none"
            stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
        </svg>
      </button>
    </div>

    <div id="filterPanel" class="filter-panel"
      th:classappend="${form.kind != null or form.supplierId != null} ? ' is-open' : ''">

      <form id="catalogFilterForm" th:object="${form}" class="filter-form">

        <input type="hidden" th:field="*{keyword}">
        <input type="hidden" th:field="*{page}">

        <div class="filter-grid">
          <div class="filter-item">
            <label for="kind" class="field-label">種別</label>
            <select id="kind" th:field="*{kind}">
              <option value="">すべて</option>
              <option th:each="kind : ${T(com.example.p2p.enums.ItemKind).values()}" th:value="${kind}"
                th:text="${kind.label}">
              </option>
            </select>
          </div>

          <div class="filter-item">
            <label for="supplierId" class="field-label">仕入先</label>
            <select id="supplierId" th:field="*{supplierId}">
              <option value="">すべて</option>
              <option th:each="s : ${supplierOptions}" th:value="${s.supplierId}" th:text="${s.name}">
              </option>
            </select>
          </div>
        </div>

        <div class="filter-actions">
          <button type="button" id="filterSubmitButton" class="filter-submit-button">
            絞り込む
          </button>

          <button type="button" id="filterResetButton" class="filter-reset-button">
            リセット
          </button>
        </div>
      </form>
    </div>

    <div class="catalog-result-area" th:fragment="catalogResultArea">
      <table class="list-table">
        <thead>
          <tr>
            <th class="col-name">名称</th>
            <th class="col-kind">種別</th>
            <th class="col-supplier">仕入先</th>
            <th class="col-unit">単位</th>
            <th class="col-price">価格</th>
            <th class="col-quantity">数量</th>
            <th class="col-action">追加</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="item : ${view.items}">
            <td class="col-name" th:text="${item.name}"></td>
            <td class="col-kind" th:text="${item.kind.label}"></td>
            <td class="col-supplier" th:text="${item.supplier}"></td>
            <td class="col-unit" th:text="${item.unit}"></td>
            <td class="col-price" th:text="${#numbers.formatInteger(item.price, 1, 'COMMA')}"></td>
            <td class="col-quantity">
              <input type="number" class="quantity-input" value="1" min="1">
            </td>
            <td class="col-action">
              <button type="button" class="add-button" th:data-item-id="${item.itemId}" th:data-name="${item.name}"
                th:data-kind="${item.kind}" th:data-supplier="${item.supplier}" th:data-unit="${item.unit}"
                th:data-price="${item.price}">
                追加
              </button>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="pagination" th:if="${!#lists.isEmpty(view.pageNumberList)}">
        <button type="button" class="page-link" th:if="${view.currentPage > 1}" th:data-page="${view.currentPage - 1}">
          &lt;
        </button>

        <button type="button" class="page-link" th:each="pageNo : ${view.pageNumberList}"
          th:classappend="${pageNo == view.currentPage} ? ' active' : ''" th:data-page="${pageNo}" th:text="${pageNo}">
        </button>

        <button type="button" class="page-link" th:if="${view.currentPage < #lists.size(view.pageNumberList)}"
          th:data-page="${view.currentPage + 1}">
          &gt;
        </button>
      </div>
    </div>

    <th:block th:fragment="catalogSearchErrors" th:object="${form}">
      <p class="field-error" th:each="err : ${#fields.errors('*')}" th:text="${err}"></p>
    </th:block>

    <div class="catalog-footer">
      <div class="selected-summary">
        <button type="button" id="toggleSelectedAreaButton" class="selected-button">
          <span>追加予定</span>
          <span><span id="selectedCount">0</span>件</span>
        </button>

        <span class="selected-total-label">
          <span>税抜合計</span>
          <span><span id="footerTotalAmount">0</span>円</span>
        </span>
      </div>

      <div id="selectedArea" class="selected-area" hidden>
        <table class="list-table">
          <thead>
            <tr>
              <th class="selected-col-name">名称</th>
              <th class="selected-col-kind">種別</th>
              <th class="selected-col-supplier">仕入先</th>
              <th class="selected-col-unit">単位</th>
              <th class="selected-col-price">価格</th>
              <th class="selected-col-quantity">数量</th>
              <th class="selected-col-subtotal">小計</th>
              <th class="selected-col-action">削除</th>
            </tr>
          </thead>

          <tbody id="selectedRows">
          </tbody>

        </table>

      </div>

      <div class="footer-actions">
        <button type="button" id="confirmButton" class="confirm-button">
          明細へ反映
        </button>
        <button type="button" id="cancelButton" class="cancel-button">
          キャンセル
        </button>
      </div>
    </div>

  </main>

</body>

</html>
