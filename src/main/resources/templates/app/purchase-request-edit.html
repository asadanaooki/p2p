<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/app/purchase-request-form.css}">
  <link rel="stylesheet" th:href="@{/css/fragments/catalog.css}" />

  <script th:inline="javascript">
    window.initialViewDetails = /*[[${view.details}]]*/[];
    window.initialFormDetails = /*[[${initialDetails}]]*/ null;
    window.initialDeletedPrDetailIds = /*[[${initialDeletedPrDetailIds}]]*/[];
  </script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script defer th:src="@{/js/common.js}"></script>
  <script defer th:src="@{/js/app/purchase-request-edit.js}"></script>
  <script defer th:src="@{/js/fragments/catalog.js}"></script>

</head>

<body>
  <main class="pr-form-page pr-edit-page">
    <h1 class="pr-page-title">PR編集</h1>

    <div class="pr-page-error-message" th:if="${invalidStatusMessage}" th:text="${invalidStatusMessage}"></div>

    <form id="purchaseRequestEditForm" th:action="@{/purchase-request/{prId}/edit(prId=${prId})}" th:object="${form}"
      method="post">
      <div class="pr-header-card">
        <div class="pr-form-group pr-status-group">
          <div class="pr-label">状態</div>
          <div th:text="${view.status.label}"></div>
        </div>

        <div class="pr-form-group">
          <div class="pr-label">番号</div>
          <div th:text="${view.displayNumber}"></div>
        </div>

        <div class="pr-form-group">
          <div class="pr-label">申請者</div>
          <div th:text="${view.requester}"></div>
        </div>

        <div class="pr-form-group">
          <label for="dueDate" class="pr-label">納期</label>
          <input type="date" id="dueDate" th:field="*{dueDate}" class="pr-input">
        </div>

        <div class="pr-form-group">
          <div class="pr-label">作成日時</div>
          <div th:text="${#temporals.format(view.createdAt, 'yyyy/M/d')}"></div>
        </div>
      </div>

      <div class="pr-detail-error-summary" th:if="${detailErrorMessages != null && !detailErrorMessages.isEmpty()}">
        <div th:each="entry : ${detailErrorMessages}">
          <div th:text="|明細${entry.key + 1}行目|"></div>

          <ul>
            <li th:each="message : ${entry.value}" th:text="${message}"></li>
          </ul>
        </div>
      </div>

      <div class="pr-detail-card">
        <table class="pr-detail-table">
          <colgroup>
            <col class="pr-col-no">
            <col class="pr-col-name">
            <col class="pr-col-kind">
            <col class="pr-col-supplier">
            <col class="pr-col-unit">
            <col class="pr-col-price">
            <col class="pr-col-quantity">
            <col class="pr-col-subtotal">
            <col class="pr-col-actions">
          </colgroup>

          <thead>
            <tr>
              <th>No.</th>
              <th>品名</th>
              <th>種別</th>
              <th>仕入先</th>
              <th>単位</th>
              <th>単価</th>
              <th>数量</th>
              <th>小計</th>
              <th>操作</th>
            </tr>
          </thead>

          <tbody id="purchaseRequestDetailRows">
          </tbody>
        </table>

        <div class="pr-detail-footer">
          <div class="pr-detail-footer-left">
            <button type="button" id="openCatalogButton" class="pr-detail-add-button">カタログから追加</button>
            <button type="button" id="openFreeInputButton" class="pr-detail-add-button">フリー入力</button>
          </div>

          <div class="pr-amount-summary">
            <span class="pr-amount-label">税抜合計</span>
            <span class="pr-amount-value"><span id="detailSubtotalAmount">0</span>円</span>

            <span class="pr-amount-label">消費税(10%)</span>
            <span class="pr-amount-value"><span id="detailTaxAmount">0</span>円</span>

            <span class="pr-amount-label">税込合計</span>
            <span class="pr-amount-value"><span id="detailTotalAmount">0</span>円</span>
          </div>
        </div>
      </div>

      <div class="pr-note-card">
        <label for="note" class="pr-label">備考</label>
        <textarea id="note" th:field="*{note}" class="pr-textarea"></textarea>
        <div class="pr-error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></div>
      </div>

      <div id="purchaseRequestDetailHiddenInputs"></div>

      <div class="pr-submit-area">
        <button id="purchaseRequestSubmitButton" type="submit" class="pr-submit-button" disabled>更新</button>
        <a th:href="@{/purchase-request/{prId}(prId=${prId})}" class="pr-cancel-button">キャンセル</a>
      </div>
    </form>

    <template id="kindOptionsTemplate">
      <option value=""></option>
      <option th:each="kind : ${T(com.example.p2p.enums.ItemKind).values()}" th:value="${kind}" th:text="${kind.label}">
      </option>
    </template>

    <template id="unitOptionsTemplate">
      <option value=""></option>
      <option th:each="unit : ${view.unitOptions}" th:value="${unit.unitId}" th:text="${unit.name}">
      </option>
      <option value="manual">手入力</option>
    </template>

    <template id="supplierOptionsTemplate">
      <option value=""></option>
      <option th:each="supplier : ${view.supplierOptions}" th:value="${supplier.supplierId}" th:text="${supplier.name}">
      </option>
      <option value="manual">手入力</option>
    </template>

    <div id="catalogModal" class="pr-modal" th:data-catalog-modal-url="@{/catalog}" hidden>
      <div class="pr-modal-backdrop"></div>

      <div id="catalogModalContent" class="pr-modal-content"></div>
    </div>

  </main>
</body>

</html>
