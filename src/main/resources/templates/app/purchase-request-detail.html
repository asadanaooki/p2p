<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app/purchase-request-detail.css}">

</head>

<body>
  <main class="page">
    <div class="success-message" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="page-error-message" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <h1 class="page-title">購買申請詳細</h1>
    <div class="page-actions">
      <a class="edit-button" th:if="${view.canEdit}" th:href="@{/purchase-request/{prId}/edit(prId=${prId})}">編集</a>
      <span th:unless="${view.canEdit}" class="edit-button is-disabled">編集</span>

      <div class="dropdown">
        <button class="edit-button dropdown-toggle" type="button" data-bs-toggle="dropdown">操作</button>

        <ul class="dropdown-menu">
          <li>
            <button type="button" class="dropdown-item" data-bs-toggle="modal" data-bs-target="#voidModal">
              無効化
            </button>
          </li>
        </ul>
      </div>
    </div>


    <div class="summary-grid">
      <div class=" status-summary-item">
        <div class="summary-label">状態</div>
        <div class="summary-value" th:text="${view.status.label}"></div>
      </div>

      <div>
        <div class="summary-label">番号</div>
        <div class="summary-value" th:text="${view.displayNumber}"></div>
      </div>

      <div>
        <div class="summary-label">申請者</div>
        <div class="summary-value" th:text="${view.requester}"></div>
      </div>

      <div>
        <div class="summary-label">納期</div>
        <div class="summary-value" th:text="${#temporals.format(view.dueDate, 'yyyy/M/d')}"></div>
      </div>

      <div>
        <div class="summary-label">申請日</div>
        <div class="summary-value" th:text="${#temporals.format(view.createdAt, 'yyyy/M/d')}"></div>
      </div>
    </div>

    <table class="detail-table">
      <thead>
        <tr>
          <th class="col-line">No.</th>
          <th class="col-name">名称</th>
          <th class="col-kind">区分</th>
          <th class="col-supplier">仕入先</th>
          <th class="col-unit">単位</th>
          <th class="col-price">単価</th>
          <th class="col-quantity">数量</th>
          <th class="col-subtotal">小計</th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="detail, stat: ${view.details}">
          <td class="text-right" th:text="${stat.count}"></td>
          <td th:text="${detail.itemName}"></td>
          <td th:text="${detail.kind.label}"></td>
          <td th:text="${detail.supplierName}"></td>
          <td th:text="${detail.unitName}"></td>
          <td class="text-right" th:text="${#numbers.formatInteger(detail.unitPrice, 1, 'COMMA')}"></td>
          <td class="text-right" th:text="${detail.quantity}"></td>
          <td class="text-right" th:text="${#numbers.formatInteger(detail.subtotalExcludingTax, 1, 'COMMA')}"></td>
        </tr>
      </tbody>
    </table>

    <div class="amount-area">
      <div class="amount-cell">税抜合計</div>
      <div class="amount-cell" th:text="${#numbers.formatInteger(view.totalAmountExcludingTax, 1, 'COMMA')}"></div>

      <div class="amount-cell">消費税(10%）</div>
      <div class="amount-cell" th:text="${#numbers.formatInteger(view.taxAmount, 1, 'COMMA')}"></div>

      <div class="amount-cell">税込合計</div>
      <div class="amount-cell" th:text="${#numbers.formatInteger(view.totalAmountIncludingTax, 1, 'COMMA')}"></div>
    </div>

    <div class="info-area">
      <div class="info-block">
        <div class="info-label">備考</div>
        <div class="info-value" th:text="${view.note}"></div>
      </div>

      <!-- 承認状況 -->
      <div class="mt-4">
        <h2 class="h6 mb-1 fw-normal approval-title">承認状況</h2>

        <div class="pt-2 ps-2">
          <!-- ステップ単位 -->
          <div class="mb-3" th:each="step : ${view.approvalProgressSteps}">
            <!-- ステップ見出し -->
            <div class="approval-progress-line approval-step-line border-bottom pb-2 mb-1">
              <div class="approval-name-area d-flex align-items-center gap-2">
                <span class="approval-step-dot"
                  th:classappend="${step.stepOrder == view.currentStepOrder} ? 'is-current' : ''"></span>
                <div class="fw-normal" th:text="${step.stepName}"></div>
              </div>

              <div class="approval-status-area">
                <span th:if="${step.stepOrder &lt; view.currentStepOrder}"
                  class="badge bg-success-subtle text-success-emphasis d-inline-flex align-items-center">承認済み</span>
                <span th:if="${step.stepOrder == view.currentStepOrder}"
                  class="badge bg-warning-subtle text-warning-emphasis d-inline-flex align-items-center">現在承認待ち</span>
                <span th:if="${step.stepOrder &gt; view.currentStepOrder}"
                  class="badge bg-secondary-subtle text-secondary-emphasis d-inline-flex align-items-center">未処理</span>
              </div>
            </div>

            <!-- 承認者一覧 -->
            <div class="approval-progress-line approval-approver-line"
              th:each="approver : ${step.approvalProgressApprovers}">
              <div>
                <div class="fw-normal" th:text="${approver.userName}"></div>
                <div class="small text-muted mt-1" th:if="${approver.comment != null}" th:text="${approver.comment}">
                </div>
              </div>

              <div class="approval-approver-status">
                <span th:if="${approver.status.toString().equals('APPROVED')}">承認済み</span>
                <span th:if="${approver.status.toString().equals('REJECTED')}">否認</span>
                <span
                  th:if=" ${approver.status.toString().equals('PENDING') and step.stepOrder == view.currentStepOrder}">承認待ち</span>
                <span
                  th:if="${approver.status.toString().equals('PENDING') and step.stepOrder &gt; view.currentStepOrder}">未処理</span>
                <span
                  th:if="${approver.status.toString().equals('PENDING') and step.stepOrder &lt; view.currentStepOrder}">承認不要</span>

                <span class="small text-muted ms-1" th:if="${approver.actedAt != null}">
                  (<span th:text="${#temporals.format(approver.actedAt, 'yyyy/M/d')}"></span>)
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 無効化モーダル -->
    <div class="modal fade" id="voidModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <button type="button" class="btn-close align-self-end m-2 mb-0" data-bs-dismiss="modal"></button>
          <form th:action="@{/purchase-request/{prId}/void(prId=${prId})}" method="post">

            <div class="modal-body">
              <label for="reason" class="form-label">備考（任意）</label>
              <textarea id="reason" name="reason" class="form-control" rows="4"></textarea>
            </div>

            <div class="modal-footer">
              <button type="submit" class="btn btn-danger">無効化</button>
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">戻る</button>
            </div>
          </form>
        </div>
      </div>

    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
