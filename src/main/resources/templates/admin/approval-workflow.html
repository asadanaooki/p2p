<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>設定</title>
  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/admin/approval-workflow.css}" />
</head>

<body>
  <main class="page">
    <h1 class="page-title">承認ステップ ー
      <span th:text="${documentType.label}"></span>
    </h1>

    <form id="workflowForm" action="#" method="post">
      <div class="workflow-steps" id="workflowSteps">
        <div class="workflow-step-block" th:each="step : ${view.approvalSteps}" th:data-step-id="${step.approvalStepId}"
          data-deleted="false">

          <div class="step-number">
            <span th:text="${step.stepOrder}"></span>
          </div>

          <div class="step-card">
            <div class="step-card-header">
              <div th:text="${step.name}"></div>
              <div class="step-actions">
                <button type="button" class="step-action-button js-edit-step">
                  ✎
                </button>

                <button type="button" class="step-action-button js-approver-modal">
                  👤
                </button>

                <button type="button" class="step-action-button danger js-delete-step">
                  🗑
                </button>
              </div>
            </div>

            <div class="approver-list">
              <div class="approver-card" th:each="approver : ${step.approvalStepApprovers}">
                <div th:text="${approver.userName}"></div>
                <div th:text="${approver.email}"></div>
              </div>
            </div>
          </div>

        </div>

        <div class="workflow-add-step">
          <button type="button" class="add-step-button js-open-step-modal">
            ＋ ステップを追加
          </button>
        </div>
      </div>

      <div class="workflow-footer">
        <button type="submit" class="save-button">保存</button>
        <a class="cancel-button" th:href="@{/setting/approval/document}">キャンセル</a>
      </div>

      <div id="hiddenFields"></div>

    </form>
