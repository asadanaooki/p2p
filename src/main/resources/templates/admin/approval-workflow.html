<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>設定</title>
  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/admin/approval-workflow.css}" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/admin/approval-workflow.js}"></script>
</head>

<body>
  <main class="page">
    <h1 class="page-title">承認ステップ ー
      <span th:text="${documentType.label}"></span>
    </h1>

    <form id="workflowForm" th:object="${form}"
      th:action="@{/setting/approval/{documentType}/workflow(documentType=${documentType})}" method="post">
      <div class="workflow-steps" id="workflowSteps">
        <div class="workflow-step-block" th:each="step, stat : *{approvalSteps}"
          th:data-step-id="${step.approvalStepId}" th:data-step-index="${stat.index}" data-deleted="false">

          <div class="step-number">
            <span th:text="${stat.index + 1}"></span>
          </div>

          <div class="step-card">
            <div class="step-card-header">
              <div th:text="${step.name}"></div>
              <div class="step-actions">
                <button type="button" class="step-action-button js-edit-step">
                  ✎
                </button>

                <button type="button" class="step-action-button js-approver-modal">
                  👤
                </button>

                <button type="button" class="step-action-button danger js-delete-step">
                  🗑
                </button>
              </div>
            </div>

            <div class="approver-list"
              th:classappend="${!#lists.isEmpty(step.approvalStepApprovers)} ? 'has-approvers'">
              <div class="approver-card" th:each="approver, stat : ${step.approvalStepApprovers}"
                th:data-user-id="${approver.userId}" th:data-email="${approver.email}"
                th:data-threshold-from="${approver.amountMin}" th:data-threshold-to="${approver.amountMax}">

                <button type="button" class="approver-delete-button js-delete-approver">×</button>

                <div th:text="${approver.userName}"></div>
                <div th:text="${approver.email}"></div>

                <div class="approver-threshold">
                  <span>承認閾値：</span>
                  <span th:text="${#numbers.formatInteger(approver.amountMin, 1, 'COMMA')}"></span>
                  <span>円 ～</span>
                  <th:block th:if="${approver.amountMax != null}">
                    <span th:text="${#numbers.formatInteger(approver.amountMax, 1, 'COMMA')}"></span>
                    <span>円</span>
                  </th:block>


                </div>
              </div>
            </div>
          </div>

        </div>

        <div class="workflow-add-step">
          <button type="button" class="add-step-button js-open-step-modal">
            ＋ ステップを追加
          </button>
        </div>
      </div>

      <div class="workflow-footer">
        <button type="submit" class="save-button">保存</button>
        <a class="cancel-button" th:href="@{/setting/approval/document}">キャンセル</a>
      </div>

      <div id="hiddenFields"></div>

    </form>

    <!-- ステップ追加・編集モーダル -->
    <div class="modal-overlay is-hidden" id="stepModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="stepModalTitle">ステップを追加</h2>
          <button type="button" class="modal-close js-close-modal">×</button>
        </div>

        <div>
          <label for="stepName">ステップ名</label>
          <input type="text" id="stepName" class="form-input">

          <div class="field-error is-hidden" id="stepNameError">
            ステップ名を入力してください。
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="primary-button js-save-step">保存</button>
          <button type="button" class="secondary-button js-close-modal">キャンセル</button>
        </div>
      </div>

    </div>

    <!-- 承認者追加モーダル -->
    <div class="modal-overlay is-hidden" id="approverModal">
      <div class="modal-content approver-modal-content">
        <div class="modal-header">
          <h2 class="modal-title">承認者を追加</h2>
          <button type="button" class="modal-close js-close-modal">×</button>
        </div>

        <div class="form-field">
          <label for="approverUserId">承認者</label>
          <select id="approverUserId" class="form-input">
            <option value=""></option>
            <option th:each="user : ${userOptions}" th:value="${user.userId}" th:text="${user.name}"
              th:data-email="${user.email}">
            </option>
          </select>

          <div class="field-error is-hidden" id="approverUserError"></div>

        </div>

        <div class="form-field">
          <label>承認閾値</label>

          <div class="threshold-inputs">
            <input type="number" id="thresholdFrom" class="form-input" min="0">
            <span>～</span>
            <input type="number" id="thresholdTo" class="form-input" min="0">
          </div>

          <div class="field-error is-hidden" id="thresholdFromError"></div>
        </div>

        <div class="modal-actions">
          <button type="button" class="primary-button js-save-approver">追加</button>
          <button type="button" class="secondary-button js-close-modal">キャンセル</button>
        </div>

      </div>

    </div>




    <!-- <div class="modal-overlay is-hidden" id="approverModal">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title">承認者を追加</h2>
            <button type="button" class="modal-close js-close-modal">×</button>
          </div>

          <div class="form-field">
            <label for="approverUserId">承認者</label>
            <select id="approverUserId" class="form-input">
              <option value=""></option>

            </select>

          </div>

        </div> -->

    <!-- </div> -->

    <!-- ステップテンプレート -->
    <template id="stepTemplate">
      <div class="workflow-step-block" data-step-id="" data-deleted="false">

        <div class="step-number"></div>

        <div class="step-card">
          <div class="step-card-header">
            <div class="step-name"></div>
            <div class="step-actions">
              <button type="button" class="step-action-button js-edit-step">
                ✎
              </button>

              <button type="button" class="step-action-button js-approver-modal">
                👤
              </button>

              <button type="button" class="step-action-button danger js-delete-step">
                🗑
              </button>
            </div>
          </div>

          <div class="approver-list">
          </div>
        </div>
      </div>
    </template>



  </main>

</body>

</html>
