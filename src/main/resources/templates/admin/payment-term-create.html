<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/admin/payment-term-create.css}">
</head>

<body>
  <main class="page">
    <h1 class="page-title">支払い条件作成</h1>

    <form th:action="@{/setting/payment-term/create}" method="post" class="unit-form" th:object="${form}">
      <div class="form-group">
        <label class="form-label" for="name">名称</label>
        <input class="form-input" type="text" id="name" th:field="*{name}"
          th:classappend="${#fields.hasErrors('name')} ? 'input-error' : ''">
        <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="days">日数</label>
        <input
          class="form-input" type="number" id="days" th:field="*{days}"
          th:classappend="${#fields.hasErrors('days')} ? 'input-error' : ''">
        <p class="field-error" th:if="${#fields.hasErrors('days')}"
          th:errors="*{days}"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="dueDateType">種別</label>
        <select
          id="dueDateType" class="form-select" th:field="*{dueDateType}">
          <option value="NET_DAYS">指定日数後</option>
          <option value="THIS_MONTH_DAY">当月指定日</option>
          <option value="NEXT_MONTH_DAY">翌月指定日</option>
        </select>
      </div>

      <div class="button-area">
        <button type="submit" class="submit-button">登録</button>
        <a th:href="@{/setting/payment-term}" class="cancel-button">キャンセル</a>
      </div>

    </form>
  </main>
</body>

</html>
